     <body>
      <h1>Mostrar el número mayor.</h1>

        <label> Ingrese el primer número: </label>
        <input type="text" id="numero1">
        <br> 
        <label> Ingrese el segundo número: </label>
        <input type="text" id="numero2">
        <br>
       
       <button type="button" onclick=" mostrarNMayor() ">  Mostrar Número Mayor </button>
      

           <script>
             function mostrarNMayor (){
               let num1 =parseInt (document.getElementById ("numero1").value);
               let num2 =parseInt(document.getElementById ("numero2").value);
              if ( num1 > num2){
              alert (" El número mayor es: " + num1);
              }
              else if (num2 > num1){
              alert ( "EL número mayor es: " + num2);
                }
             else { alert("Ambos números son iguales"); }
              }
             
            </script>
    
          
        

        </body>
